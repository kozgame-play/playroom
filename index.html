<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kozgame ゲームポータル　テストだよ</title>
    
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="kozgame">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    
    <style>
        /* カラー設定 */
        :root {
            --bg-purple: #5c187d;
            --card-purple: #3a0a52;
            --text-light: #ffffff;
            
            /* 各ゲームのテーマカラー */
            --color-spe: #3b82f6;      /* 青 */
            --color-2430: #22c55e;     /* 緑 */
            --color-dan: #ef4444;      /* 赤 */
            --color-sky: #0ea5e9;      /* スカイブルー（新色） */
            
            --shadow-dark: #1a0426;
        }

        body {
            font-family: 'DotGothic16', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-purple);
            background-image: linear-gradient(rgba(0, 0, 0, 0.1) 2px, transparent 2px);
            background-size: 100% 4px;
            color: var(--text-light);
            padding: 1rem;
            box-sizing: border-box;
        }

        .card {
            background: var(--card-purple);
            padding: 2.5rem 2rem;
            border-radius: 0;
            border: 4px solid var(--text-light);
            box-shadow: 8px 8px 0px var(--shadow-dark);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            font-weight: 400;
            font-size: 2.8rem;
            margin: 0 0 0.5rem 0;
            letter-spacing: 2px;
            text-transform: lowercase;
            text-shadow: 3px 3px 0px var(--shadow-dark);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #d8b4e2;
            margin-bottom: 2.5rem;
            letter-spacing: 2px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 1.2rem; /* ボタンが増えたので間隔を少し調整 */
        }

        .play-button {
            display: block;
            position: relative;
            padding: 1rem;
            text-decoration: none;
            color: var(--text-light);
            background: #000;
            border: 3px solid var(--text-light);
            box-shadow: 6px 6px 0px var(--shadow-dark);
            transition: all 0.1s;
        }

        /* ボタンごとの背景色 */
        .btn-spe { background-color: var(--color-spe); }
        .btn-2430 { background-color: var(--color-2430); }
        .btn-dan { background-color: var(--color-dan); }
        .btn-sky { background-color: var(--color-sky); }

        .play-button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px var(--shadow-dark);
            filter: brightness(1.2);
        }

        .play-button:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0px var(--shadow-dark);
        }

        /* バッジ装飾 */
        .badge {
            display: inline-block;
            background-color: #facc15;
            color: #000;
            font-size: 0.8rem;
            padding: 0.1rem 0.5rem;
            margin-bottom: 0.5rem;
            border: 2px solid #000;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .game-title {
            display: block;
            font-size: 1.5rem;
            margin-bottom: 0.2rem;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        .game-desc {
            display: block;
            font-size: 0.9rem;
            opacity: 0.9;
            background: rgba(0, 0, 0, 0.4);
            padding: 0.2rem 0.5rem;
            margin-top: 0.4rem;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>kozgame　てすとだぜいえー</h1>
        <div class="subtitle">▶ SELECT GAME</div>
        
        <div class="button-container">
            <a href="SKYDRIFT.html" class="play-button btn-sky">
                <span class="badge">NEW!!</span>
                <span class="game-title">SKYDRIFT</span>
                <span class="game-desc">爽快ドリフトレース</span>
            </a>

            <a href="SPE-DEFE.html" class="play-button btn-spe">
                <span class="game-title">SPA-DEFE</span>
                <span class="game-desc">タワーディフェンス</span>
            </a>
            
            <a href="2430.html" class="play-button btn-2430">
                <span class="game-title">2430</span>
                <span class="game-desc">カードゲーム</span>
            </a>
            
            <a href="DANMA-K.html" class="play-button btn-dan">
                <span class="game-title">DANMA-K</span>
                <span class="game-desc">弾幕シューティング</span>
            </a>
            
        </div>
    </div>

</body>
</html>
