<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kozgame ゲームポータル</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* 高さ設定を調整 */
            margin: 0;
            background-color: #f0f2f5;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 1.5rem;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 1rem; /* ボタン同士の間隔 */
        }
        .play-button {
            display: block;
            padding: 14px 24px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.1s, background-color 0.2s;
        }
        /* ボタンごとの色分け（お好みで変更してください） */
        .btn-spe {
            background-color: #007bff;
        }
        .btn-spe:hover {
            background-color: #0056b3;
        }
        .btn-2430 {
            background-color: #28a745;
        }
        .btn-2430:hover {
            background-color: #218838;
        }
        .play-button:active {
            transform: scale(0.98); /* クリック時に少しへこむ演出 */
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>kozgame<br>ゲームを選択</h1>
        <div class="button-container">
            <!-- SPE-DIFE.html へのリンク -->
            <a href="SPE-DIFE.html" class="play-button btn-spe">【20260503 new!!】<br>SPE-DIFE(タワーディフェンスゲーム)</a>
            
            <!-- 2430.html へのリンク -->
            <a href="2430.html" class="play-button btn-2430">【20260503 new!!】<br>2430（オリジナルカードゲーム）</a>
        </div>
    </div>

</body>
</html>
